[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "partsmatch-api"
version = "0.1.0"
description = "PartsMatch API service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "pillow-heif>=0.22,<2",
  "pytesseract>=0.3.13,<1",
  "passlib[bcrypt]>=1.7,<2",
  "psycopg[binary]>=3.2,<4",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.12,<1",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
  "xlrd>=2.0.1,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "pytest-asyncio>=0.24,<1",
  "xlwt>=1.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
