name: partsmatch-api

services:
  api:
    build:
      context: ./api
      target: runtime
    image: partsmatch-api:production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8000"
    secrets:
      - database_url
      - redis_url
      - s3_access_key
      - s3_secret_key
      - jwt_secret
      - admin_initial_username
      - admin_initial_password
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend, edge]

  frontend:
    build:
      context: ./frontend
    image: partsmatch-frontend:production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8881:8881"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8881/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [edge]

  admin:
    build:
      context: ./admin
    image: partsmatch-admin:production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8882:8882"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8882/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [edge]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: partsmatch
      POSTGRES_USER: partsmatch
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partsmatch -d partsmatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    secrets: [s3_access_key, s3_secret_key]
    ports:
      - "127.0.0.1:8890:9000"
      - "127.0.0.1:8891:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend, edge]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    secrets: [s3_access_key, s3_secret_key]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set storage http://minio:9000 "$$(cat /run/secrets/s3_access_key)" "$$(cat /run/secrets/s3_secret_key)" &&
        mc mb --ignore-existing storage/partsmatch &&
        mc anonymous set none storage/partsmatch
    networks: [backend]

secrets:
  database_url: { file: ./.secrets/database_url }
  postgres_password: { file: ./.secrets/postgres_password }
  redis_url: { file: ./.secrets/redis_url }
  s3_access_key: { file: ./.secrets/s3_access_key }
  s3_secret_key: { file: ./.secrets/s3_secret_key }
  jwt_secret: { file: ./.secrets/jwt_secret }
  admin_initial_username: { file: ./.secrets/admin_initial_username }
  admin_initial_password: { file: ./.secrets/admin_initial_password }

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  backend:
    internal: true
  edge:
